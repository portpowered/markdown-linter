$schema: https://json-schema.org/draft/2020-12/schema
title: Rule documentation metadata
type: object
additionalProperties:
  type: object
  additionalProperties: false
  required: [summary, parameters, example-options, example]
  properties:
    summary: {type: string, minLength: 1}
    notes: {type: string}
    parameters:
      type: object
      additionalProperties: {type: string, minLength: 1}
    example-options: {type: object}
    example:
      type: object
      additionalProperties: false
      required: [language, bad, good, explanation]
      properties:
        language: {enum: [markdown, yaml]}
        bad: {type: string, minLength: 1}
        good: {type: string, minLength: 1}
        explanation: {type: string, minLength: 1}
