markdown.blank-lines:
  summary: Requires blank separation before top-level headings, lists and fenced code blocks when preceding
    content exists.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: 'Text

      ## Details

      '
    good: 'Text


      ## Details

      '
    explanation: The heading needs a blank line before it.
markdown.doc-id-unique:
  summary: Reports duplicate document IDs from the documentation index across the selected Markdown files.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '---

      doc-id: DOC-1

      ---

      # First

      '
    good: '---

      doc-id: DOC-2

      ---

      # Second

      '
    explanation: If another selected document already uses DOC-1, the duplicate ID fails. Each document
      needs a distinct ID.
markdown.document-identifier:
  summary: Checks configured frontmatter identifier fields for presence, format, uniqueness and optional
    filename agreement.
  parameters:
    identifiers: 'Nonempty list of identifier specifications. Fields: field (required), name, paths, required,
      pattern, format-label, unique, match-filename.'
  example-options:
    identifiers:
    - field: id
      required: true
      pattern: ^DOC-[0-9]+$
      unique: true
  example:
    language: markdown
    bad: '---

      id: wrong

      ---

      # Guide

      '
    good: '---

      id: DOC-12

      ---

      # Guide

      '
    explanation: The configured identifier pattern requires DOC- followed by digits.
markdown.document-structure:
  summary: Checks required frontmatter fields and level-two headings for configured document path groups.
  parameters:
    types: 'Nonempty list of document groups. Fields: paths, required-fields, required-headings, any-headings,
      alternative-message. Headings are level two.'
  example-options:
    types:
    - paths:
      - docs
      required-fields:
      - title
      required-headings:
      - Purpose
  example:
    language: markdown
    bad: '# Guide

      '
    good: '---

      title: Guide

      ---

      # Guide


      ## Purpose

      '
    explanation: A document under docs must contain the configured title field and Purpose heading.
markdown.fence-closed:
  summary: Reports fenced code blocks with no matching closing fence.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '```text

      Example

      '
    good: '```text

      Example

      ```

      '
    explanation: The opening code fence has no closing fence.
markdown.fence-language:
  summary: Requires a language label on fenced code blocks; use text for plain text examples.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '```

      Example

      ```

      '
    good: '```text

      Example

      ```

      '
    explanation: The code fence needs an explicit language label.
markdown.final-newline:
  summary: Requires exactly one final newline and provides a safe fix.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: Text
    good: 'Text

      '
    explanation: The file must end with exactly one newline. The first example has no final newline.
markdown.formatting:
  summary: Combines unclosed code-fence and trailing-whitespace checks.
  parameters:
    allow-hard-breaks: Permit exactly two trailing spaces as Markdown hard breaks; false rejects them.
  example-options:
    allow-hard-breaks: true
  example:
    language: markdown
    bad: "Text   \n"
    good: 'Text

      '
    explanation: Three trailing spaces are not an allowed two-space hard break.
markdown.frontmatter-valid:
  summary: Reports invalid YAML in the initial frontmatter block.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '---

      title: First

      title: Second

      ---

      # Guide

      '
    good: '---

      title: Guide

      ---

      # Guide

      '
    explanation: Duplicate frontmatter keys fail strict YAML validation.
markdown.heading-duplicates:
  summary: Reports duplicate sibling headings within the same heading hierarchy.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '# Guide


      ## Setup


      ## Setup

      '
    good: '# Guide


      ## Setup


      ## Usage

      '
    explanation: Sibling headings at the same level have duplicate normalized text.
markdown.heading-order:
  summary: Reports skipped heading levels, such as H2 followed by H4.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '# Guide


      ### Details

      '
    good: '# Guide


      ## Details

      '
    explanation: The heading jumps from level one to level three.
markdown.html-policy:
  summary: Reports raw HTML tags outside the configured tag allowlist.
  parameters:
    allow: HTML tag names permitted in raw HTML; empty rejects all tags.
  example-options:
    allow: []
  example:
    language: markdown
    bad: 'Text <script>alert(1)</script>

      '
    good: 'Text `alert(1)`

      '
    explanation: The configured HTML allow list is empty. Raw script tags fail the style policy.
markdown.image-alt:
  summary: Requires image alt text unless the destination is explicitly allowed as decorative.
  parameters:
    allow: Image destinations permitted to omit alt text as explicitly decorative.
  example-options:
    allow: []
  example:
    language: markdown
    bad: '![](diagram.png)

      '
    good: '![Request flow](diagram.png)

      '
    explanation: The image has no descriptive alternative text.
markdown.line-length:
  summary: Reports prose lines over the character limit, excluding code, table rows and lines containing
    URLs.
  parameters:
    max: Maximum character count for a prose line; must be positive.
  example-options:
    max: 120
  example:
    language: markdown
    bad: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

      '
    good: 'A short line.

      '
    explanation: The first line exceeds the configured maximum of 120 characters.
markdown.link-relocation:
  summary: Finds moved local Markdown targets and suggests reviewed link repairs using a shared documentation
    index.
  parameters:
    moves: Mapping of old local document paths to their new paths, used for explicit relocation candidates.
  example-options:
    moves:
      docs/old.md: docs/new.md
  example:
    language: markdown
    bad: '[Guide](old.md)

      '
    good: '[Guide](new.md)

      '
    explanation: When the documentation index or configured moves maps old.md to new.md, the stale link
      needs the new destination.
markdown.link-text:
  summary: Requires descriptive link labels and rejects empty labels and click here.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '[click here](https://example.test)

      '
    good: '[API guide](https://example.test)

      '
    explanation: The link label is a generic action `rather` than a useful description.
markdown.list-style:
  summary: Checks the unordered-list marker and nested indentation against the configured convention.
  parameters:
    allow: The first one-character entry selects the unordered-list marker; empty uses a hyphen.
    indent: Nested unordered-list indentation in spaces; must be between 1 and 8.
  example-options:
    allow: []
    indent: 2
  example:
    language: markdown
    bad: "- Parent\n    - Child\n"
    good: "- Parent\n  - Child\n"
    explanation: The child uses four spaces of indentation instead of the configured two spaces.
markdown.local-links:
  summary: Checks local link destinations and anchors, with document-root boundaries and an optional directory
    allowance.
  parameters:
    allow-directories: Allow directory destinations in local links; false by default.
  example-options:
    allow-directories: false
  example:
    language: markdown
    bad: '[Guide](missing.md)

      '
    good: '[Guide](https://example.test/guide)

      '
    explanation: The local target does not exist within the document root. External destinations are excluded
      from this offline check.
markdown.ordered-list:
  summary: Checks ordered-list numbering against sequential, all-one, or either convention.
  parameters:
    style: 'Ordered numbering convention: one, ordered, or one-or-ordered.'
  example-options:
    style: one-or-ordered
  example:
    language: markdown
    bad: '1. First

      3. Second

      '
    good: '1. First

      2. Second

      '
    explanation: The numbering is neither all ones nor consecutive.
markdown.reference-definitions:
  summary: Reports duplicate reference-link definitions and missing definitions for explicit reference
    uses.
  parameters: {}
  example-options: {}
  example:
    language: markdown
    bad: '[Guide][missing]

      '
    good: '[Guide][api]


      [api]: https://example.test

      '
    explanation: The reference label has no definition.
markdown.required-heading:
  summary: Requires a heading with exactly the configured text and level in every selected document.
  parameters:
    heading: Exact text of the required heading; must be nonempty.
    level: Required heading level from 1 through 6.
  example-options:
    heading: Purpose
    level: 2
  example:
    language: markdown
    bad: '# Guide

      '
    good: '# Guide


      ## Purpose

      '
    explanation: The configured level-two Purpose heading is missing.
markdown.single-title:
  summary: Requires one H1 title, or accepts a frontmatter title when configured.
  parameters:
    frontmatter-title: Accept frontmatter containing a title field instead of requiring an H1.
  example-options:
    frontmatter-title: false
  example:
    language: markdown
    bad: '# First


      # Second

      '
    good: '# Guide


      ## Second

      '
    explanation: The document has two level-one titles instead of exactly one.
markdown.trailing-whitespace:
  summary: Reports trailing spaces or tabs outside code and provides a safe removal fix. Two-space hard
    breaks are permitted by default.
  parameters:
    allow-hard-breaks: Permit exactly two trailing spaces as Markdown hard breaks; false rejects them.
  example-options:
    allow-hard-breaks: true
  example:
    language: markdown
    bad: "Text   \n"
    good: 'Text

      '
    explanation: Trailing spaces are prohibited except for an allowed two-space hard break.
text.repeated-word:
  summary: Reports adjacent repeated words in prose, compared without case sensitivity.
  parameters:
    allow: Explicit exceptions, compared without case sensitivity where the check operates on prose.
    scope: Prose by default; heading restricts findings to headings. Code and URL destinations are excluded.
  example-options:
    allow: []
    scope: prose
  example:
    language: markdown
    bad: 'The the API.

      '
    good: 'The API.

      '
    explanation: The same word occurs twice in sequence, compared without case sensitivity. The second
      the is reported; punctuation or a paragraph boundary breaks the sequence.
text.spelling:
  summary: Rejects words outside the supplied offline dictionary and explicit allowlist for the declared
    language.
  parameters:
    allow: Explicit exceptions, compared without case sensitivity where the check operates on prose.
    dictionary: Exact approved word forms as a string list; no dictionary fallback. Required for text.spelling;
      an alternative to dictionary-file for STE100.
    language: Nonempty language label for the supplied spelling vocabulary; does not download a dictionary.
    scope: Prose by default; heading restricts findings to headings. Code and URL destinations are excluded.
  example-options:
    allow: []
    dictionary:
    - use
    - the
    - api
    language: en-US
    scope: prose
  example:
    language: markdown
    bad: 'Utilize the API.

      '
    good: 'Use the API.

      '
    explanation: The supplied offline dictionary approves use, the and api. It does not approve `utilize`.
text.ste100.dictionary:
  summary: Rejects prose words outside the supplied approved vocabulary, explicit forms and complete technical
    terms; rejected alternatives remain suggestions.
  parameters:
    dictionary: Exact approved word forms as a string list; no dictionary fallback. Required for text.spelling;
      an alternative to dictionary-file for STE100.
    dictionary-file: Literal YAML dictionary path relative to the lint root. Accepts words, entries with
      forms/metadata, technical-terms and alternatives.
    scope: Prose by default; heading restricts findings to headings. Code and URL destinations are excluded.
    technical-terms: Complete approved technical phrases; individual words are not approved outside the
      phrase.
  example-options:
    scope: prose
    dictionary:
    - use
    - the
    - api
  notes: See [STE100 vocabulary and grammar](../ste100.md) for explicit inflections, alternatives, technical
    phrases and semantic limitations.
  example:
    language: markdown
    bad: 'Utilize the API.

      '
    good: 'Use the API.

      '
    explanation: '`Utilize` is absent from the configured approved vocabulary. Word forms must be listed
      explicitly; alternatives suggest replacements but remain rejected.'
text.ste100.grammar:
  summary: Checks a configurable lexical sentence limit and named forbidden grammar patterns.
  parameters:
    forbidden-patterns: Mapping of diagnostic names to Go regular expressions. Patterns must not match
      empty text; an empty mapping disables pattern checks.
    max-sentence-words: Positive lexical word limit per sentence; default 25. This is a configurable heuristic,
      not complete standard word counting.
    scope: Prose by default; heading restricts findings to headings. Code and URL destinations are excluded.
  example-options:
    max-sentence-words: 25
    scope: prose
  notes: See [STE100 vocabulary and grammar](../ste100.md) for explicit inflections, alternatives, technical
    phrases and semantic limitations.
  example:
    language: markdown
    bad: 'word word word word word word word word word word word word word word word word word word word
      word word word word word word word.

      '
    good: 'Use the API.

      '
    explanation: The first sentence contains 26 words, above the configured limit of 25.
text.strunk-white.correlative-pairs:
  summary: 'Flags finite mismatched pair constructions: ``both/or``, `either/and`, or `neither/or`; invites
    editorial review.'
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'Use both red or blue.

      '
    good: 'Use both red and blue.

      '
    explanation: Both pairs with and. The matcher flags ``both/or`` when no balancing and occurs inside
      the match.
text.strunk-white.exclamations:
  summary: Flags exclamation marks in prose for editorial review.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'Done!

      '
    good: 'Done.

      '
    explanation: The matcher detects an exclamation mark in prose.
text.strunk-white.existential-openings:
  summary: Flags sentence openings such as there is and there are for a more direct subject.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'There are three records.

      '
    good: 'Three records exist.

      '
    explanation: The matcher detects a sentence opening with there are and reports that phrase.
text.strunk-white.fancy-words:
  summary: Flags a finite list of ornate words such as ``utilize`` and `aforementioned`.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'Utilize the cache.

      '
    good: 'Use the cache.

      '
    explanation: The default matcher detects ``utilize`` and suggests familiar wording.
text.strunk-white.needless-words:
  summary: Flags a finite list of wordy phrases such as ``in order to`` and `at this point in time`.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'Run in order to verify.

      '
    good: 'Run to verify.

      '
    explanation: The default matcher detects ``in order to`` and invites a shorter expression.
text.strunk-white.negative-phrases:
  summary: Flags selected negative constructions such as ``not uncommon`` for editorial review.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'This is not uncommon.

      '
    good: 'This is common.

      '
    explanation: The default matcher detects ``not uncommon``. Use positive wording when it preserves
      the meaning.
text.strunk-white.passive-voice:
  summary: Flags selected agent-bearing passive constructions with by; it does not classify every passive
    sentence.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
