      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'It should of worked.

      '
    good: 'It should have worked.

      '
    explanation: The matcher detects a modal followed by of instead of have.
text.terminology:
  summary: Reports configured disfavored words or phrases and suggests the preferred terminology without
    automatically rewriting.
  parameters:
    allow: Explicit exceptions, compared without case sensitivity where the check operates on prose.
    scope: Prose by default; heading restricts findings to headings. Code and URL destinations are excluded.
    terms: Nonempty mapping of disfavored words or phrases to preferred wording.
  example-options:
    allow: []
    scope: prose
    terms:
      utilize: use
  example:
    language: markdown
    bad: 'Utilize the API.

      '
    good: 'Use the API.

      '
    explanation: The configured terminology mapping prefers use over `utilize`.
text.matcher:
  summary: Reports configurable prohibited words, phrases, characters or regular expression matches in
    prose.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    banned-words:
    - utilize
    - in order to
    message: Use a shorter, familiar expression
  notes: Portos bans are configured instances of this check. Strunk and White checks supply named defaults
    to the same matcher; all matcher options can be overridden. No automatic rewrite is applied.
  example:
    language: markdown
    bad: 'Utilize the API in order to test.

      '
    good: 'Use the API to test.

      '
    explanation: The configured banned words include `utilize` and the phrase `in order to`. Both matches
      produce findings.
