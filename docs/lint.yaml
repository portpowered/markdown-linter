  docs.simple-grammar:
    check: text.ste100.grammar
    options:
      max-sentence-words: 19
      forbidden-patterns:
        contractions: (?i)\b(?:[a-z]+n['’]t|(?:i|you|we|they|he|she|it)['’](?:m|re|ve|ll|d|s))\b
sets:
  documentation:
    use:
    - markdown:recommended
    - text:strunk-white
    rules:
    - rule: docs.single-title
      'on': document
    - rule: docs.repeated-word
      'on': document
    - rule: docs.approved-vocabulary
      'on': document
    - rule: docs.simple-grammar
      'on': document
  reference-pages:
    rules:
    - rule: docs.page-shape
      'on': document
apply:
- use:
  - documentation
- files:
  - .site-docs/rules/**
  exclude:
  - .site-docs/rules/index.md
  use:
  - reference-pages
