descriptor:
  capabilities:
  - structure
  execution: local
  fix: none
  fixtures:
  - name: violation
    input: 'Run in order to verify.

      '
    parameters:
      allow: []
      scope: prose
    expected: fail
  - name: accepted
    input: 'Run to verify.

      '
    parameters:
      allow: []
      scope: prose
    expected: pass
  formats:
  - markdown
  id: text.strunk-white.needless-words
  languages:
  - '*'
  parametersSchema:
    additionalProperties: false
    properties:
      allow:
        items:
          type: string
        type: array
      banned-characters:
        type: string
      banned-words:
        items:
          type: string
        type: array
      capture-group:
        type: integer
      ignore-case:
        type: boolean
      message:
        type: string
      paired-conjunctions:
        additionalProperties:
          type: string
        type: object
      patterns:
        items:
          type: string
        type: array
      scope:
        type: string
    type: object
  resultKind: assertion
  summary: Flags a finite list of wordy phrases such as ``in order to`` and `at this point in time`.
  targets:
  - document
  version: '2'
defaults:
  allow: []
  banned-characters: ''
  banned-words: []
  capture-group: 0
  ignore-case: true
  message: consider a shorter expression while preserving meaning
  paired-conjunctions: {}
  patterns:
  - (?i)\b(?:in\s+order\s+to|due\s+to\s+the\s+fact\s+that|at\s+this\s+point\s+in\s+time|in\s+the\s+event\s+that|for\s+the\s+purpose\s+of|the\s+question\s+as\s+to\s+whether|in\s+a\s+manner\s+that|on\s+a\s+daily\s+basis)\b
  scope: prose
recommendedSeverity: warning
presets:
- text:strunk-white
documentation:
  summary: Flags a finite list of wordy phrases such as ``in order to`` and `at this point in time`.
  parameters:
    patterns: List of Go RE2 patterns to report; patterns cannot match empty text.
    banned-words: Literal whole words or phrases to report. Spaces match soft line breaks and emphasis.
    banned-characters: Literal characters to report individually. Use patterns for Unicode character classes.
    ignore-case: Case-insensitive matching by default; false preserves case.
    allow: Exact matched phrases to accept, compared without case sensitivity.
    scope: prose covers headings and paragraphs; heading checks headings only. Code and URLs are excluded.
    message: Explanation to show with the matched text.
    capture-group: Report this capture group instead of the whole match; zero reports the whole match.
      The group must exist in every pattern.
    paired-conjunctions: Skip a match beginning with a key when its paired word occurs inside that match;
      used for both/and, either/or, neither/nor.
  example-options:
    allow: []
    scope: prose
  notes: This is a finite editorial signal, not a general grammar parser. See [Strunk and White](../strunk-white.md)
    for covered patterns and legitimate exceptions. This check is a default configuration of text.matcher.
    Override patterns, banned-words or the message to customize the policy.
  example:
    language: markdown
    bad: 'Run in order to verify.

      '
    good: 'Run to verify.

      '
    explanation: The default matcher detects ``in order to`` and invites a shorter expression.
  'on': document
