    input: 'Text <script>alert(1)</script>

      '
    parameters:
      allow: []
    expected: fail
  - name: accepted
    input: 'Text `alert(1)`

      '
    parameters:
      allow: []
    expected: pass
  formats:
  - markdown
  id: markdown.html-policy
  languages:
  - '*'
