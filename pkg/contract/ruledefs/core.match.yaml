descriptor:
  capabilities:
  - text
  execution: local
  fix: none
  fixtures:
  - name: violation
    input: 'Utilize the cache.

      '
    parameters:
      mode: word
      expect: absent
      values:
      - utilize
      case: fold
    expected: fail
  - name: accepted
    input: 'Use the cache.

      '
    parameters:
      mode: word
      expect: absent
      values:
      - utilize
      case: fold
    expected: pass
  formats:
  - markdown
  - mdx
  id: core.match
  languages:
  - '*'
  parametersSchema:
    additionalProperties: false
    oneOf:
    - not:
        anyOf:
        - required:
          - pattern
        - required:
          - regex
      properties:
        mode:
          const: equals
      required:
      - values
    - not:
        anyOf:
        - required:
          - pattern
        - required:
          - regex
      properties:
        mode:
          const: contains
      required:
      - values
    - not:
        anyOf:
        - required:
          - pattern
        - required:
          - regex
      properties:
        mode:
          const: word
      required:
      - values
    - not:
        anyOf:
        - required:
          - values
        - required:
          - regex
      properties:
        mode:
          const: pattern
      required:
      - pattern
    - not:
        anyOf:
        - required:
          - values
        - required:
          - pattern
      properties:
        mode:
          const: regex
      required:
      - regex
    properties:
      anchor:
        enum:
        - full
        - search
      case:
        enum:
        - sensitive
        - fold
      expect:
        enum:
        - present
        - absent
      mode:
        enum:
        - equals
        - contains
        - word
        - pattern
        - regex
      pattern:
        maxLength: 65536
        type: string
      regex:
        maxLength: 4096
        type: string
      values:
        items:
          minLength: 1
          type: string
        minItems: 1
        type: array
      view:
        enum:
        - auto
        - prose
        - visible
        - source
        - code
        - language
        - cell
    required:
    - mode
    type: object
  resultKind: assertion
  summary: Checks literal text, words, surface patterns, or regular expressions.
  targets:
  - document
  - section
  - heading
  - paragraph
  - sentence
  - source-line
  - codeblock
  - cell
  version: '2'
defaults: {}
recommendedSeverity: error
presets: []
documentation:
  summary: Checks literal text, words, surface patterns, or regular expressions.
  parameters:
    mode: Choose equals, contains, word, pattern, or regex.
    expect: Require a match to be present or absent.
    case: Select sensitive comparison or Unicode case folding.
    view: Select prose, visible text, source, code, language, or cell text.
    values: Nonempty literal operands for equals, contains, or word mode.
    pattern: Embedded literal alternatives with named nonempty captures.
    regex: Bounded Go RE2 expression; empty matches are invalid.
    anchor: Regex search by default; full requires the complete selected unit.
  example-options:
    mode: word
    expect: absent
    values:
    - utilize
    case: fold
  'on': document
  example:
    language: markdown
    bad: 'Utilize the cache.

      '
    good: 'Use the cache.

      '
    explanation: The forbidden word appears in visible text.
