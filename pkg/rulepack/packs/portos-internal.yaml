version: 1
rules:
  - id: portos.prose-dashes
    check: text.matcher
    severity: error
    options:
      patterns: ['[-\p{Pd}]']
      message: Avoid hyphens and dashes in prose
  - id: portos.banned-phrases
    check: text.matcher
    severity: error
    options:
      patterns: ['\bload[\s\p{Pd}]+bearing\b']
      message: Avoid this project-specific phrase
